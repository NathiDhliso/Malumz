[build]
  # Set the base directory to the frontend folder
  base = "frontend"
  # The directory containing the production build
  publish = "build"
  # Set CI to an empty string so warnings don't break the build
  command = "CI= npm run build"

[build.environment]
  CI = "false"

# Proxy the API to AWS to completely avoid CORS issues
[[redirects]]
  from = "/api/malumz/*"
  to = "https://public-api.proprofile.co.za/public/malumz/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact"
  to = "https://public-api.proprofile.co.za/public/malumz/contact"
  status = 200
  force = true

# This rewrite rule ensures React Router handles routing natively
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
